# gitleaks 配置：在默认规则（API key、token、私钥等 150 多种）之外，
# 加上和这个仓库相关的个人敏感信息规则。
# 文档：https://github.com/gitleaks/gitleaks#configuration

title = "usstock sensitive-info rules"

[extend]
useDefault = true

[[rules]]
id = "iban"
description = "银行账号 IBAN（例如法国 FR76 开头）"
regex = '''\b[A-Z]{2}\d{2}(?:[ ]?[A-Z0-9]{4}){3,7}(?:[ ]?[A-Z0-9]{1,3})?\b'''
keywords = []
tags = ["pii", "bank"]

[[rules]]
id = "ibkr-account-number"
description = "IBKR 账号（U 加 7–8 位数字）"
regex = '''\bU\d{7,8}\b'''
keywords = ["u"]
tags = ["pii", "broker"]
  [rules.allowlist]
  description = "文档里的示例占位账号"
  regexes = ['''U1234567''', '''U0000000''']

[[rules]]
id = "french-tax-number"
description = "法国税号 numéro fiscal（13 位数字，0–3 开头）"
regex = '''\b[0-3]\d{12}\b'''
keywords = []
tags = ["pii", "tax"]

[[rules]]
id = "personal-email"
description = "个人邮箱地址"
regex = '''[A-Za-z0-9._%+-]+@(?:gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me|privaterelay\.appleid|qq|163|126|orange|free|sfr|laposte|wanadoo)\.[a-z.]{2,}'''
keywords = ["@"]
tags = ["pii", "email"]

[[rules]]
id = "french-phone-number"
description = "法国电话号码"
regex = '''(?:\+33[ .-]?|\b0)[1-9](?:[ .-]?\d{2}){4}\b'''
keywords = []
tags = ["pii", "phone"]

# 全局忽略：构建产物和私人文件目录（这些本来就在 .gitignore 里）
[allowlist]
description = "global allowlist"
paths = ['''^site/''', '''^private/''']
